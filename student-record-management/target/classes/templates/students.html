<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .container-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
            margin-top: 30px;
        }

        .page-title {
            color: #0d6efd;
            font-weight: bold;
        }

        .table th {
            background-color: #0d6efd;
            color: white;
        }

        .search-box {
            max-width: 400px;
        }

        .student-link {
            text-decoration: none;
            font-weight: bold;
        }

        .student-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand">
            Student Record Management System
        </span>

        <a href="/dashboard" class="btn btn-warning btn-sm">
            Dashboard
        </a>
    </div>
</nav>

<div class="container">

    <div class="container-box">

        <div class="d-flex justify-content-between align-items-center mb-3">

            <h2 class="page-title">Student List</h2>

            <a href="/addStudent" class="btn btn-success">
                ➕ Add Student
            </a>

        </div>

        <!-- Search -->
        <form action="/students" method="get" class="d-flex mb-3">

            <input type="text"
                   name="keyword"
                   th:value="${keyword}"
                   class="form-control search-box me-2"
                   placeholder="Search by Name or Reg No">

            <button class="btn btn-primary">
                Search
            </button>

        </form>

        <!-- Not Found -->
        <div th:if="${#lists.isEmpty(students)}"
             class="alert alert-danger text-center">

            ❌ Student Not Found

        </div>

        <!-- Table -->
        <table class="table table-bordered table-hover text-center">

            <thead>
                <tr>
<th>S.No</th>
<th>Photo</th>
<th>Register Number</th>
<th>Student Name</th>
<th>Batch</th>
<th>Actions</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="s, stat : ${students}">

                    <td th:text="${stat.count}"></td>

<td>
    <img th:if="${s.photo != null && s.photo != ''}"
         th:src="@{'/images/' + ${s.photo}}"
         width="50"
         height="50"
         class="rounded-circle"
         style="object-fit: cover;">

    <img th:if="${s.photo == null || s.photo == ''}"
         th:src="@{'/images/default.png'}"
         width="50"
         height="50"
         class="rounded-circle"
         style="object-fit: cover;">
</td>

<td th:text="${s.regNo}"></td>

                    <td>
                        <a th:href="@{'/student/' + ${s.id}}"
                           class="student-link">
                            <span th:text="${s.name}"></span>
                        </a>
                    </td>

                    <td th:text="${s.batch}"></td>

                    <td>

                        <a th:href="@{'/editStudent/' + ${s.id}}"
                           class="btn btn-warning btn-sm">
                            Edit
                        </a>

                        <a th:href="@{'/deleteStudent/' + ${s.id}}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this student?')">
                            Delete
                        </a>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
