<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .profile-card {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
        }

        .title {
            text-align: center;
            color: #0d6efd;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .table th {
            width: 35%;
            background-color: #0d6efd;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="profile-card">

        <h2 class="title">Student Profile</h2>

<!-- Student Photo -->
<div class="text-center mb-4">

    <img th:if="${student.photo != null && student.photo != ''}"
         th:src="@{'/images/' + ${student.photo}}"
         class="rounded-circle border shadow"
         width="180"
         height="180"
         style="object-fit: cover;">

    <img th:if="${student.photo == null || student.photo == ''}"
         th:src="@{'/images/default.png'}"
         class="rounded-circle border shadow"
         width="180"
         height="180"
         style="object-fit: cover;">

</div>

<table class="table table-bordered">

            <tr>
                <th>Student Name</th>
                <td th:text="${student.name}"></td>
            </tr>

            <tr>
                <th>Register Number</th>
                <td th:text="${student.regNo}"></td>
            </tr>

            <tr>
                <th>Department</th>
                <td th:text="${student.department}"></td>
            </tr>

            <tr>
    <th>Status</th>
    <td th:text="${student.status}"></td>
</tr>
<tr>
    <th>Current Year</th>
    <td th:text="${student.status == 'Completed' ? '-' : student.currentYear}"></td>
</tr>

       <tr>
    <th>Batch</th>
    <td th:text="${student.batch}"></td>
</tr>

<tr>
    <th>Phone Number</th>
    <td th:text="${student.phoneNumber}"></td>
</tr>

            <tr>
                <th>Email</th>
                <td th:text="${student.email}"></td>
            </tr>

            <tr>
                <th>CGPA</th>
                <td th:text="${student.cgpa}"></td>
            </tr>

            <tr>
                <th>Attendance (%)</th>
                <td th:text="${student.attendance}"></td>
            </tr>

        </table>

       <div class="text-center">

    <a th:href="@{/student/{id}/activities(id=${student.id})}"
       class="btn btn-success">
        📌 Activities
    </a>

    <a href="/students"
       class="btn btn-primary">
        Back to Students
    </a>

</div>

    </div>

</div>

</body>
</html>
