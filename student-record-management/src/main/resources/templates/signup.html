<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Portal - Sign Up</title>

```
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#4facfe,#00f2fe);
        font-family:Arial, Helvetica, sans-serif;
        padding:20px;
    }

    .signup-card{
        width:450px;
        background:#fff;
        padding:40px;
        border-radius:20px;
        box-shadow:0 15px 35px rgba(0,0,0,0.2);
    }

    .portal-logo{
        font-size:60px;
        text-align:center;
        margin-bottom:10px;
    }

    .portal-title{
        text-align:center;
        font-weight:bold;
        color:#0d6efd;
    }

    .portal-subtitle{
        text-align:center;
        color:gray;
        margin-bottom:25px;
    }

    .btn-signup{
        width:100%;
        border-radius:10px;
        padding:10px;
        font-weight:bold;
    }

    .login-link{
        text-align:center;
        margin-top:15px;
    }

    .login-link a{
        text-decoration:none;
        font-weight:bold;
    }

</style>
```

</head>

<body>

<div class="signup-card">

```
<div class="portal-logo">
    🎓
</div>

<h2 class="portal-title">
    Create Account
</h2>

<p class="portal-subtitle">
    Student Management Portal
</p>

<form action="/register" method="post">

    <div class="mb-3">
        <label class="form-label">Full Name</label>

        <input type="text"
               name="fullName"
               class="form-control"
               placeholder="Enter Full Name"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>

        <input type="email"
               name="email"
               class="form-control"
               placeholder="Enter Email"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Username</label>

        <input type="text"
               name="username"
               class="form-control"
               placeholder="Choose Username"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Password</label>

        <input type="password"
               id="password"
               name="password"
               class="form-control"
               placeholder="Create Password"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Confirm Password</label>

        <input type="password"
               id="confirmPassword"
               name="confirmPassword"
               class="form-control"
               placeholder="Confirm Password"
               required>
    </div>

    <div class="mb-3">
        <input type="checkbox"
               onclick="togglePassword()">
        Show Password
    </div>

    <button type="submit"
            class="btn btn-success btn-signup">
        Create Account
    </button>

    <div class="login-link">
        Already have an account?
        <a href="/">
            Login
        </a>
    </div>

</form>
```

</div>

<script>

function togglePassword(){

    let password =
        document.getElementById("password");

    let confirmPassword =
        document.getElementById("confirmPassword");

    if(password.type === "password"){

        password.type = "text";
        confirmPassword.type = "text";

    }else{

        password.type = "password";
        confirmPassword.type = "password";
    }
}

</script>

</body>
</html>
