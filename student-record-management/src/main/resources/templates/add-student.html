<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .form-card {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
        }

        .title {
            text-align: center;
            color: #0d6efd;
            font-weight: bold;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="form-card">

        <h2 class="title">Student Registration Form</h2>

        <form action="/saveStudent"
      method="post"
      enctype="multipart/form-data">

            <input type="hidden"
                   name="id"
                   th:value="${student.id}">

            <!-- Name -->
            <div class="mb-3">
                <label class="form-label">Student Name</label>
                <input type="text"
                       name="name"
                       class="form-control"
                       th:value="${student.name}"
                       required>
            </div>

            <!-- Register Number -->
            <div class="mb-3">
                <label class="form-label">Register Number</label>
                <input type="text"
                       name="regNo"
                       class="form-control"
                       th:value="${student.regNo}"
                       required>
            </div>

            <!-- Department -->
            <div class="mb-3">
                <label class="form-label">Department</label>

                <select name="department" class="form-select">
                    <option value="CSE">CSE</option>
                    <option value="ECE">ECE</option>
                    <option value="EEE">EEE</option>
                    <option value="IT">IT</option>
                    <option value="MECH">MECH</option>
                    <option value="CIVIL">CIVIL</option>
                </select>
            </div>
            <!-- Batch -->
             <div class="mb-3">
    <label class="form-label">Batch</label>

    <input type="text"
           name="batch"
           class="form-control"
           placeholder="2024-2028"
           th:value="${student.batch}"
           required>
</div>

<!-- Phone Number -->
<div class="mb-3">
    <label class="form-label">Phone Number</label>

    <input type="text"
           name="phoneNumber"
           class="form-control"
           placeholder="9876543210"
           th:value="${student.phoneNumber}"
           required>
</div>
<!-- Status -->
<div class="mb-3">
    <label class="form-label">Status</label>

    <select id="status"
        name="status"
        class="form-select"
        onchange="toggleYear()">

    <option value="Ongoing" th:selected="${student.status == 'Ongoing'}">Ongoing</option>
    <option value="Completed" th:selected="${student.status == 'Completed'}">Completed</option>
    <option value="Discontinued" th:selected="${student.status == 'Discontinued'}">Discontinued</option>

</select>
</div>
            <!-- Current Year -->
<div class="mb-3" id="yearDiv">

    <label class="form-label">Year</label>

    <select name="currentYear" class="form-select">
    <option value="1st Year" th:selected="${student.currentYear == '1st Year'}">1st Year</option>
    <option value="2nd Year" th:selected="${student.currentYear == '2nd Year'}">2nd Year</option>
    <option value="3rd Year" th:selected="${student.currentYear == '3rd Year'}">3rd Year</option>
    <option value="4th Year" th:selected="${student.currentYear == '4th Year'}">4th Year</option>
</select>

</div>
            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Email</label>

                <input type="email"
                       name="email"
                       class="form-control"
                       th:value="${student.email}"
                       required>
            </div>

            <!-- CGPA -->
            <div class="mb-3">
                <label class="form-label">CGPA</label>

                <input type="number"
                       step="0.01"
                       min="0"
                       max="10"
                       name="cgpa"
                       class="form-control"
                       th:value="${student.cgpa}"
                       required>
            </div>

            <!-- Attendance -->
            <div class="mb-3">
                <label class="form-label">Attendance (%)</label>

                <input type="number"
                       step="0.01"
                       min="0"
                       max="100"
                       name="attendance"
                       class="form-control"
                       th:value="${student.attendance}"
                       required>
            </div>
            <!-- Student Photo -->
<!-- Student Photo -->
<div class="mb-3">
    <label class="form-label">Student Photo</label>

    <!-- Existing Photo -->
    <div th:if="${student.photo != null && student.photo != ''}">
        <img th:src="@{'/images/' + ${student.photo}}"
             width="140"
             height="140"
             style="object-fit:cover;border-radius:10px;border:2px solid #0d6efd;">
        <br><br>
    </div>

    <input type="file"
           name="photoFile"
           class="form-control"
           accept="image/*">

    <small class="text-muted">
        Leave empty if you don't want to change the photo.
    </small>
</div>

            <!-- Buttons -->
            <div class="text-center">

                <button type="submit"
                        class="btn btn-success">
                    Save Student
                </button>

                <a href="/students"
                   class="btn btn-secondary">
                    Back
                </a>

            </div>

        </form>

    </div>

</div>
<script>
function toggleYear() {
    let status = document.getElementById("status").value;
    let yearDiv = document.getElementById("yearDiv");

    if (status === "Completed") {
        yearDiv.style.display = "none";

        // optional: clear value
        document.querySelector("[name='currentYear']").value = "";
    } else {
        yearDiv.style.display = "block";
    }
}

window.onload = function () {
    toggleYear();
};
</script>

</body>
</html>
