<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Portal - Login</title>

```
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#4facfe,#00f2fe);
        font-family:Arial, Helvetica, sans-serif;
    }

    .login-card{
        width:420px;
        background:#fff;
        padding:40px;
        border-radius:20px;
        box-shadow:0 15px 35px rgba(0,0,0,0.2);
    }

    .portal-logo{
        font-size:60px;
        text-align:center;
        margin-bottom:10px;
    }

    .portal-title{
        text-align:center;
        font-weight:bold;
        color:#0d6efd;
    }

    .portal-subtitle{
        text-align:center;
        color:gray;
        margin-bottom:25px;
    }

    .btn-login{
        width:100%;
        border-radius:10px;
        padding:10px;
        font-weight:bold;
    }

    .signup-link{
        text-align:center;
        margin-top:15px;
    }

    .signup-link a{
        text-decoration:none;
        font-weight:bold;
    }

</style>
```

</head>

<body>

<div class="login-card">

```
<div class="portal-logo">
    🎓
</div>

<h2 class="portal-title">
    Student Management Portal
</h2>

<p class="portal-subtitle">
    Welcome Back
</p>

<form action="/dashboard" method="post">

    <div class="mb-3">
        <label class="form-label">
            Username
        </label>

        <input type="text"
               name="username"
               class="form-control"
               placeholder="Enter Username"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">
            Password
        </label>

        <input type="password"
               id="password"
               name="password"
               class="form-control"
               placeholder="Enter Password"
               required>
    </div>

    <div class="mb-3">
        <input type="checkbox"
               onclick="togglePassword()">

        Show Password
    </div>

    <button type="submit"
            class="btn btn-primary btn-login">
        Login
    </button>

    <div class="signup-link">
        Don't have an account?
        <a href="/signup">
            Sign Up
        </a>
    </div>

</form>
```

</div>

<script>

function togglePassword(){

    let password =
        document.getElementById("password");

    if(password.type === "password"){
        password.type = "text";
    }
    else{
        password.type = "password";
    }
}

</script>

</body>
</html>
