<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Activities</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .container-box{
            max-width:900px;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container-box">

    <h2 class="text-center text-primary mb-4">
        📌 Student Activities
    </h2>

    <div class="text-end mb-3">

        <a th:href="@{/student/{id}/addActivity(id=${studentId})}"
           class="btn btn-success">
            ➕ Add Activity
        </a>

    </div>

    <table class="table table-bordered table-hover">

        <thead class="table-primary">
        <tr>
            <th>Type</th>
            <th>Name</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="activity : ${activities}">
            <td th:text="${activity.activityType}"></td>
            <td th:text="${activity.activityName}"></td>
            <td th:text="${activity.startDate}"></td>
<td th:text="${activity.endDate}"></td>
            <td>
    <a th:href="@{/deleteActivity/{id}(id=${activity.id})}"
       class="btn btn-danger btn-sm">
       Delete
    </a>
</td>
        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
